# Source registry: which domains, feeds and channels the pipeline trusts, and
# at what tier. Tiers are defined in config/credibility-rubric.yaml.
#
# The pipeline looks a URL up here and nowhere else. A host that matches no
# entry is Tier 4 (hard rule tier_from_registry). Nothing a page says about
# itself can change its tier.
#
# Matching
#   domains           the host or any subdomain of it (www. is ignored)
#   url_prefixes      exact prefix of the URL after scheme and www.
#   youtube_channels  channel ids, for youtube.com / youtu.be links and feeds
# The most specific match wins: url_prefixes, then youtube_channels, then the
# longest matching domain.
#
# Wayback Machine links (web.archive.org/web/<timestamp>/<url>) are looked up
# by the archived URL, so a snapshot carries the tier of what it is a copy of.
#
# Owner decisions recorded here (2026-09-30):
#   - Tier 2 outlets are the six listed below, each marked
#     corrections_policy: unverified until the owner confirms it.
#   - Lake & McHenry County Scanner is Tier 3.
#   - Court dockets and Recorder searches are manual: `automate: false`.

version: 0.1.0
updated: 2026-10-01

# Labels the site shows next to each source on the Documents page
# (scripts/build-source-tiers.js reads them from here, so the page cannot
# drift from this registry). A source's label is its entry's `kind` if it
# has one, `party_statement` for a party_statement source, else its tier.
labels:
  tier_1: Tier 1 · public record
  party_statement: Tier 1 · party statement
  tier_2: Tier 2 · established outlet
  news_report: Tier 3 · news report
  trade: Tier 3 · trade press
  aggregator: Tier 3 · aggregator
  advocacy: Tier 3 · advocacy group
  tier_4: Tier 4 · unreviewed

